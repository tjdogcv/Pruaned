<svg viewBox="0 0 500 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Outer Shield Clip Path -->
    <clipPath id="shield-inner">
      <path d="M 250,25 C 380,25 440,75 440,225 C 440,400 250,490 250,490 C 250,490 60,400 60,225 C 60,75 120,25 250,25 Z" />
    </clipPath>

    <!-- Star of Life Clip & Gradients -->
    <linearGradient id="star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B4B8A" />
      <stop offset="100%" stop-color="#002855" />
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Dark Navy Border -->
  <path d="M 250,12 C 395,12 460,65 460,225 C 460,415 250,510 250,510 C 250,510 40,415 40,225 C 40,65 105,12 250,12 Z" fill="#0C2340" />

  <!-- Shield Quadrants -->
  <g clip-path="url(#shield-inner)">
    <!-- Quadrant 1: Top-Left Red -->
    <rect x="50" y="20" width="200" height="210" fill="#DC2626" />
    <!-- Flame Silhouette -->
    <path d="M 140,190 C 100,180 85,145 105,115 C 115,100 135,90 135,70 C 135,70 145,95 155,100 C 170,108 185,125 180,150 C 175,175 160,190 140,190 Z" fill="#FFB703" />
    <path d="M 140,185 C 120,180 112,158 125,140 C 132,130 145,120 145,105 C 145,105 152,120 158,125 C 168,133 172,148 168,162 C 162,178 152,185 140,185 Z" fill="#FBBF24" />

    <!-- Quadrant 2: Top-Right Emerald Green -->
    <rect x="250" y="20" width="200" height="210" fill="#059669" />
    <!-- Dog & Cat Silhouettes -->
    <!-- Dog -->
    <path d="M 330,195 C 330,165 315,145 315,125 C 315,105 340,95 365,95 C 375,95 385,105 385,105 C 390,95 400,90 410,95 C 420,100 425,115 415,130 C 405,145 400,160 405,195 Z" fill="#FFFFFF" />
    <circle cx="365" cy="115" r="4" fill="#059669" />
    <!-- Cat -->
    <path d="M 390,195 C 390,175 385,160 395,145 C 398,140 395,125 405,125 C 410,125 415,130 420,125 C 430,125 435,135 435,145 C 435,165 425,180 430,195 Z" fill="#FFFFFF" />

    <!-- Quadrant 3: Bottom-Left Warm Brown -->
    <rect x="50" y="230" width="200" height="260" fill="#8B5A2B" />
    <!-- Horse Silhouette -->
    <path d="M 60,470 C 60,390 90,340 135,310 C 165,290 205,315 210,350 C 190,355 175,370 165,395 C 155,420 150,450 150,480 Z" fill="#FFFFFF" />
    <circle cx="170" cy="345" r="3.5" fill="#8B5A2B" />
    <!-- Bird / Dove Silhouette -->
    <path d="M 125,445 C 145,420 170,410 195,415 C 205,417 215,410 215,410 C 215,410 210,420 200,428 C 185,440 170,455 145,455 C 135,455 125,450 125,445 Z" fill="#FFFFFF" />

    <!-- Quadrant 4: Bottom-Right Ocean Blue -->
    <rect x="250" y="230" width="200" height="260" fill="#0066B2" />
    <!-- Red Emergency Triangle -->
    <polygon points="360,285 415,375 305,375" fill="#E63946" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" />
    <polygon points="360,310 388,360 332,360" fill="#FFFFFF" />
    <!-- Waves -->
    <path d="M 270,415 Q 295,405 320,415 T 370,415 T 420,415" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
    <path d="M 270,435 Q 295,425 320,435 T 370,435 T 420,435" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />

    <!-- White Quadrant Divider Grid Lines -->
    <line x1="250" y1="25" x2="250" y2="490" stroke="#FFFFFF" stroke-width="10" />
    <line x1="60" y1="230" x2="440" y2="230" stroke="#FFFFFF" stroke-width="10" />

    <!-- CENTER: Star of Life (Estrella de la Vida) -->
    <g transform="translate(250, 230)" filter="url(#shadow)">
      <!-- 6-Point Star Base -->
      <g fill="url(#star-grad)" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round">
        <rect x="-18" y="-85" width="36" height="170" rx="8" />
        <rect x="-18" y="-85" width="36" height="170" rx="8" transform="rotate(60)" />
        <rect x="-18" y="-85" width="36" height="170" rx="8" transform="rotate(120)" />
      </g>
      <!-- Rod of Asclepius (Vara de Esculapio) -->
      <line x1="0" y1="-65" x2="0" y2="65" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
      <path d="M -10,-45 C -20,-30 20,-20 10,-5 C 0,10 -20,20 -10,35 C 0,50 15,45 5,60" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Bottom Brand Text -->
  <text x="250" y="555" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="52" fill="#0C2340" text-anchor="middle" letter-spacing="4">PRUANED</text>
</svg>
